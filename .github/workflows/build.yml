name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Baixar IR-DB e gerar banco de códigos
        run: |
          git clone --depth 1 https://github.com/probonopd/irdb /tmp/irdb
          python3 tools/build_db.py /tmp/irdb/codes app/src/main/assets

      - name: Testes
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Compilar APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ControleIR.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ControleIR
          path: ControleIR.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Controle IR (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: ControleIR.apk
          body: APK gerado automaticamente a partir de ${{ github.sha }}.
